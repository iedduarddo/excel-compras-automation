name: Pacote portátil Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/package-windows.yml"
      - ".github/workflows/release-windows.yml"
      - "config/**"
      - "iniciar.cmd"
      - "main.py"
      - "packaging/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "run.ps1"
      - "scripts/**"
      - "src/**"
      - "tests/test_build_portable.py"
      - "tests/test_windows_scripts.py"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/package-windows.yml"
      - ".github/workflows/release-windows.yml"
      - "config/**"
      - "iniciar.cmd"
      - "main.py"
      - "packaging/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "run.ps1"
      - "scripts/**"
      - "src/**"
      - "tests/test_build_portable.py"
      - "tests/test_windows_scripts.py"

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 portátil
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python do build
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-build.txt

      - name: Verificar sintaxe
        run: python -m compileall -q main.py src scripts

      - name: Verificar qualidade
        run: python -m ruff check .

      - name: Verificar formatação
        run: python -m ruff format --check .

      - name: Executar testes e cobertura
        run: python -m pytest --cov=src --cov-report=term-missing -q

      - name: Construir e validar pacote
        shell: pwsh
        run: python scripts/build_portable.py --commit "$env:GITHUB_SHA"

      - name: Publicar artefato de inspeção
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
