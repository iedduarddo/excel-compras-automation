name: Release portátil Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir bytes oficiais
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      commit: ${{ steps.release_metadata.outputs.commit }}
    env:
      PYTHONHASHSEED: "0"

    steps:
      - name: Baixar o código e as tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python do build
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-build.txt

      - name: Validar tag, checkout e origem
        id: release_metadata
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "A tag não segue o formato vX.Y.Z: $tag"
          }

          $tagType = (git cat-file -t $tag).Trim()
          if ($tagType -ne "tag") {
              throw "A release exige uma tag anotada."
          }

          git fetch origin `
              refs/heads/main:refs/remotes/origin/main `
              --no-tags
          if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível consultar a main remota."
          }

          $tagCommit = (git rev-parse "$tag^{}").Trim()
          $checkoutCommit = (git rev-parse HEAD).Trim()
          if ($checkoutCommit -ne $tagCommit) {
              throw "O checkout não corresponde ao commit da tag."
          }

          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "O commit da tag não pertence à main."
          }

          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$tagCommit" >> $env:GITHUB_OUTPUT

      - name: Verificar sintaxe
        run: python -m compileall -q main.py src scripts

      - name: Verificar qualidade
        run: python -m ruff check .

      - name: Verificar formatação
        run: python -m ruff format --check .

      - name: Executar testes e cobertura
        run: python -m pytest --cov=src --cov-report=term-missing -q

      - name: Construir e validar os bytes oficiais
        shell: pwsh
        run: >
          python scripts/build_portable.py
          --expected-version "${{ steps.release_metadata.outputs.version }}"
          --commit "${{ steps.release_metadata.outputs.commit }}"

      - name: Guardar artefato de promoção
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  draft-release:
    name: Criar GitHub Release em rascunho
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Baixar bytes aprovados
        uses: actions/download-artifact@v8
        with:
          name: release-windows-${{ github.ref_name }}
          path: dist

      - name: Validar ZIP e checksum promovidos
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $zipName = "ExcelComprasAutomation-v$version-windows-x64.zip"
          $zip = Join-Path "dist" $zipName
          $checksum = "$zip.sha256"
          if (
              -not (Test-Path -LiteralPath $zip -PathType Leaf) -or
              -not (Test-Path -LiteralPath $checksum -PathType Leaf)
          ) {
              throw "Os assets oficiais não foram encontrados."
          }

          $checksumLine = (
              Get-Content -LiteralPath $checksum -Raw
          ).Trim()
          if (
              $checksumLine -notmatch
              '^(?<hash>[0-9a-f]{64})  (?<name>[^\\/]+\.zip)$'
          ) {
              throw "O arquivo SHA-256 possui formato inválido."
          }
          if ($Matches.name -ne $zipName) {
              throw "O checksum referencia outro arquivo."
          }

          $actualHash = (
              Get-FileHash -LiteralPath $zip -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -ne $Matches.hash) {
              throw "O ZIP promovido não corresponde ao checksum."
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead(
              (Resolve-Path -LiteralPath $zip)
          )
          try {
              if ($archive.Entries.Count -eq 0) {
                  throw "O ZIP promovido está vazio."
              }
          }
          finally {
              $archive.Dispose()
          }

      - name: Criar ou retomar o rascunho sem substituir assets
        id: draft_metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $tag = $env:GITHUB_REF_NAME
          $version = "${{ needs.build.outputs.version }}"
          $zipName = "ExcelComprasAutomation-v$version-windows-x64.zip"
          $assetNames = @($zipName, "$zipName.sha256")

          function Get-ReleaseSummary {
              $releaseListJson = (
                  gh release list `
                      --repo $env:GITHUB_REPOSITORY `
                      --limit 1000 `
                      --json databaseId,tagName,isDraft,isPrerelease
              ) -join "`n"
              if ($LASTEXITCODE -ne 0) {
                  throw "Não foi possível consultar as Releases existentes."
              }

              $converted = $releaseListJson | ConvertFrom-Json
              $releases = @(
                  foreach ($candidate in $converted) {
                      $candidate
                  }
              )
              $matches = @(
                  $releases |
                      Where-Object { $_.tagName -eq $tag }
              )
              if ($matches.Count -gt 1) {
                  throw "Há mais de uma Release associada à tag $tag."
              }
              if ($matches.Count -eq 1) {
                  return $matches[0]
              }
              return $null
          }

          $releaseSummary = Get-ReleaseSummary
          if ($null -ne $releaseSummary) {
              if (-not $releaseSummary.isDraft) {
                  throw "Já existe uma Release publicada para $tag."
              }
          }
          else {
              gh release create $tag `
                  --repo $env:GITHUB_REPOSITORY `
                  --draft `
                  --verify-tag `
                  --title "Excel Compras Automation $tag" `
                  --generate-notes
              if ($LASTEXITCODE -ne 0) {
                  throw "Não foi possível criar a Release em rascunho."
              }
          }

          $releaseSummary = Get-ReleaseSummary
          if ($null -eq $releaseSummary -or -not $releaseSummary.isDraft) {
              throw "A Release em rascunho não foi encontrada após a criação."
          }

          $releaseId = [string]$releaseSummary.databaseId
          $releaseJson = (
              gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          ) -join "`n"
          if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível consultar a Release pelo identificador."
          }
          $release = $releaseJson | ConvertFrom-Json
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT

          $existingDirectory = Join-Path $env:RUNNER_TEMP "existing-assets"
          New-Item -ItemType Directory -Path $existingDirectory -Force |
              Out-Null

          foreach ($assetName in $assetNames) {
              $localAsset = Join-Path "dist" $assetName
              $existing = @(
                  $release.assets |
                      Where-Object { $_.name -eq $assetName }
              )
              if ($existing.Count -gt 1) {
                  throw "Há assets duplicados com o nome $assetName."
              }
              if ($existing.Count -eq 1) {
                  gh release download $tag `
                      --repo $env:GITHUB_REPOSITORY `
                      --pattern $assetName `
                      --dir $existingDirectory
                  if ($LASTEXITCODE -ne 0) {
                      throw "Não foi possível conferir o asset $assetName."
                  }
                  $remoteAsset = Join-Path $existingDirectory $assetName
                  $localHash = (
                      Get-FileHash $localAsset -Algorithm SHA256
                  ).Hash
                  $remoteHash = (
                      Get-FileHash $remoteAsset -Algorithm SHA256
                  ).Hash
                  if ($localHash -ne $remoteHash) {
                      throw "O asset existente $assetName possui outros bytes."
                  }
                  continue
              }

              gh release upload $tag `
                  $localAsset `
                  --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                  throw "Não foi possível enviar o asset $assetName."
              }
          }

      - name: Confirmar pós-condições da Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $tag = $env:GITHUB_REF_NAME
          $version = "${{ needs.build.outputs.version }}"
          $releaseId = "${{ steps.draft_metadata.outputs.release_id }}"
          if ($releaseId -notmatch '^\d+$') {
              throw "O identificador da Release é inválido."
          }

          $expectedNames = @(
              @(
                  "ExcelComprasAutomation-v$version-windows-x64.zip",
                  "ExcelComprasAutomation-v$version-windows-x64.zip.sha256"
              ) | Sort-Object
          )
          $releaseJson = (
              gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          ) -join "`n"
          if ($LASTEXITCODE -ne 0) {
              throw "Não foi possível confirmar a Release pelo identificador."
          }
          $release = $releaseJson | ConvertFrom-Json
          $actualNames = @(
              $release.assets |
                  ForEach-Object { [string]$_.name } |
                  Sort-Object
          )

          if (
              -not $release.draft -or
              $release.prerelease -or
              $release.tag_name -ne $tag -or
              ($actualNames -join "`n") -ne ($expectedNames -join "`n") -or
              @($release.assets | Where-Object { $_.size -le 0 }).Count -gt 0
          ) {
              throw "A GitHub Release não possui o estado final esperado."
          }

          Write-Host "Release em rascunho criada e verificada: $($release.html_url)"
