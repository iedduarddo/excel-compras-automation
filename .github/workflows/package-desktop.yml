name: Aplicativo desktop multiplataforma

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/package-desktop.yml"
      - "config/**"
      - "desktop.py"
      - "packaging/ExcelComprasAutomationDesktop.spec"
      - "packaging/LEIA-ME-DESKTOP.txt"
      - "packaging/README_DESKTOP.md"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/build_desktop.py"
      - "scripts/build_portable.py"
      - "src/**"
      - "tests/test_build_desktop.py"
      - "tests/test_gui_controller.py"
      - "packaging/THIRD_PARTY_NOTICES.md"
      - "tests/test_gui_app.py"
      - "tests/test_gui_bridge_qt.py"
      - "tests/test_native_materials.py"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/package-desktop.yml"
      - "config/**"
      - "desktop.py"
      - "packaging/ExcelComprasAutomationDesktop.spec"
      - "packaging/LEIA-ME-DESKTOP.txt"
      - "packaging/README_DESKTOP.md"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/build_desktop.py"
      - "scripts/build_portable.py"
      - "src/**"
      - "tests/test_build_desktop.py"
      - "tests/test_gui_controller.py"
      - "packaging/THIRD_PARTY_NOTICES.md"
      - "tests/test_gui_app.py"
      - "tests/test_gui_bridge_qt.py"
      - "tests/test_native_materials.py"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: windows-x64
          - name: macOS Intel
            runner: macos-15-intel
            target: macos-intel
          - name: macOS Apple Silicon
            runner: macos-15
            target: macos-apple-silicon

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python do build
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
            requirements-desktop-build.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-desktop-build.txt

      - name: Validar Qt Quick
        run: python -c "from PySide6 import QtCore; print(QtCore.qVersion())"

      - name: Verificar qualidade e testes
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest --cov=src --cov-report=term-missing -q

      - name: Construir e validar aplicativo
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: python scripts/build_desktop.py --commit "${{ github.sha }}"

      - name: Publicar artefato de inspeção
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/*-${{ matrix.target }}-desktop.zip
            dist/*-${{ matrix.target }}-desktop.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
