[project]
name = "excel-compras-automation"
version = "1.0.0"
description = "Automação do teste prático de Excel para Analista de Compras."
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "backup", "input", "logs", "output"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "DTZ",
    "S",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Datas seriais do Excel não carregam fuso horário por definição.
"tests/test_policies.py" = ["DTZ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 34
